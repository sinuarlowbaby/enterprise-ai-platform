[project]
name = "enterprise-ai-platform-backend"
version = "0.1.0"
description = "Enterprise AI Platform Backend - Multi-Tenant RAG, Agents, Guardrails & Observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",

    # Database & Storage
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "qdrant-client>=1.11.0",
    "redis>=5.0.0",

    # Observability & Metrics
    "langfuse>=2.50.0",
    "prometheus-client>=0.20.0",

    # RAG & Document Ingestion
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.3.0",
    "tiktoken>=0.7.0",

    # Guardrails & PII
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",

    # Multi-Agent Orchestration
    "langgraph>=0.2.20",

    # Evaluation
    "ragas>=0.1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "gateway", "knowledge", "observability", "orchestration"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
